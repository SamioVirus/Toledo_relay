[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "toledo-orchestrator"
version = "0.1.0"
description = "Transport-first, file-authoritative review orchestrator"
requires-python = ">=3.11"

[project.scripts]
orchestrator = "toledo_orchestrator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
