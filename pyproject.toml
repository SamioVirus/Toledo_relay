[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "toledo-orchestrator"
version = "0.1.0"
description = "Transport-first, file-authoritative review orchestrator"
requires-python = ">=3.11"

[project.scripts]
orchestrator = "toledo_orchestrator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
toledo_orchestrator = ["projects/*.json", "prompts/*.md", "workflows/*.json", "ui/*.html", "ui/*.css", "ui/*.js"]
